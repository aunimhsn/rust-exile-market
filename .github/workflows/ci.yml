name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its runs that are still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The commits compared to tell a documentation change: the base of a pull request, or the
  # previous commit of a push.
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

# Each job runs on every change, since `main` requires them, but skips its checks when only the
# Markdown files and `docs/` change: it then succeeds in a few seconds.

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - if: steps.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --workspace --all-features

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - name: Read rust-version from Cargo.toml
        if: steps.changes.outputs.code == 'true'
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.code == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@v2
      # `+version` overrides the stable channel of rust-toolchain.toml.
      - if: steps.changes.outputs.code == 'true'
        run: cargo +${{ steps.msrv.outputs.version }} check --locked --workspace --all-targets --all-features
