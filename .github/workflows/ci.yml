name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its runs that are still going.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The commits compared to tell a documentation change: the base of a pull request, or the
  # previous commit of a push.
  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

# The toolchain is the one of rust-toolchain.toml, installed by rustup: a pinned version, the same
# here, in the Release workflow and on the owner's machine.
#
# Each job runs on every change, since `main` requires them, but skips its checks when only the
# Markdown files and `docs/` change: it then succeeds in a few seconds.

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - if: steps.changes.outputs.code == 'true'
        run: sh .github/scripts/pinned-actions.sh
      - if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changes.outputs.code == 'true'
        run: cargo fmt --all --check
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: steps.changes.outputs.code == 'true'
        run: cargo test --locked --workspace --all-features
      - if: steps.changes.outputs.code == 'true'
        run: sh .github/scripts/system-clipboard.sh

  # The code written for Windows alone (the keys of the price-check hotkey) is compiled and
  # linted on its own system, which the job above never builds. Clippy only: the tests run on
  # Linux.
  lint-windows:
    name: Lint on windows-latest
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changes.outputs.code == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # The code written for macOS alone, linted from Linux: GitHub may find no machine with macOS for
  # a quarter of an hour, then cancel the job and block the merge, and a check doesn't need one.
  # It keeps the name required by the ruleset of `main`.
  lint-macos:
    name: Lint on macos-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changes.outputs.code == 'true'
        run: sh scripts/clippy-macos.sh

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        run: sh .github/scripts/code-changed.sh "$BASE" "$HEAD"
      - name: Read rust-version from Cargo.toml
        if: steps.changes.outputs.code == 'true'
        run: echo "RUSTUP_TOOLCHAIN=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_ENV"
      # `RUSTUP_TOOLCHAIN` overrides the version of rust-toolchain.toml in the next steps, so
      # that only the minimum version is installed. Through the environment: a text read from a
      # file of the pull request is never written into a script.
      - if: steps.changes.outputs.code == 'true'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - if: steps.changes.outputs.code == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.changes.outputs.code == 'true'
        run: cargo check --locked --workspace --all-targets --all-features
