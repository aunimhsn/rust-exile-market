name: Release

# A version tag (for example v0.1.0) builds the archives and publishes them as
# a GitHub release. A pull request that changes this workflow or the
# dependencies only builds them, to check every system before the next tag.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, Cargo.toml, Cargo.lock]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Version in the archive names: the tag, or "test" for a pull request.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test' }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # glibc rather than musl: the executable loads the graphics
          # libraries of the system (OpenGL, X11), which a static musl
          # executable can't. It runs on distributions with the glibc of
          # the runner or a newer one, hence the oldest Ubuntu runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read the executable name and the version of Cargo.toml
        run: |
          # The package of the application, the default member of the workspace (the
          # other members are tools, such as the generator of the game data).
          metadata=$(cargo metadata --no-deps --format-version 1)
          package=$(echo "$metadata" | jq -c '.workspace_default_members[0] as $id | .packages[] | select(.id == $id)')
          # The first binary target: the package name, unless [[bin]] or
          # src/bin/ gives another one.
          name=$(echo "$package" | jq -r '[.targets[] | select(.kind | index("bin")) | .name][0] // empty')
          if [ -z "$name" ]; then
            echo "Cargo.toml has no binary target to release"
            exit 1
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$(echo "$package" | jq -r '.version')" >> "$GITHUB_ENV"
      - name: Check that the tag matches the version of Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $PACKAGE_VERSION of Cargo.toml"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          directory="$NAME-$VERSION-${{ matrix.target }}"
          mkdir "$directory"
          cp README.md LICENSE-APACHE LICENSE-MIT "$directory/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$NAME.exe" "$directory/"
            7z a "$directory.zip" "$directory"
            echo "ARCHIVE=$directory.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/$NAME" "$directory/"
            tar -czf "$directory.tar.gz" "$directory"
            echo "ARCHIVE=$directory.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
