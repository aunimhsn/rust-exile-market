name: Release

# A version tag (for example v0.1.0) builds the archives and publishes them as
# a GitHub release, when its commit is on main. A pull request that changes this workflow or the
# dependencies only builds them, to check every system before the next tag;
# run by hand on a branch (Actions, Release, Run workflow), it builds them too,
# for a tester of a system the owner doesn't have.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.toml
      - Cargo.lock
      # A new version of Rust builds every system before the next tag.
      - rust-toolchain.toml
      - about.hbs
      - about.toml
      - deny.toml
      # The files the Package step copies, so that a rename fails here rather than at the tag.
      - LICENSE
      - assets/NOTICE.md
      - assets/game-data/NOTICE.md
      - assets/fonts/ofl-*.txt
      - assets/icons/isc-lucide.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Version in the archive names: the tag, or "test" for a pull request or a
  # branch.
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'test' }}

jobs:
  # A release only from a commit of main, which went through a pull request and its checks, with
  # the toolchain of rust-toolchain.toml: a tag put by mistake on another commit builds nothing.
  # Not a lock: the workflow run is the one of the tagged commit, so a commit made to remove
  # this job would still publish (an environment with the owner's approval would close that,
  # see backlog.md). The ruleset of the tags (`v*`) keeps them from being moved or deleted.
  tag:
    name: Check that the tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The commit of $GITHUB_REF_NAME is not on main: nothing is released"
            exit 1
          fi

  # One file for the four archives: about.toml lists the targets of the matrix below.
  notices:
    name: Check the advisories and the licenses, and write the notices
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.3
      # A security advisory on a dependency, not sorted in deny.toml yet, stops the release.
      - run: cargo deny --locked check advisories licenses
      - run: cargo about generate --locked --fail --output-file THIRD-PARTY-LICENSES about.hbs
      # A license file of a crate that keeps the template of its copyright line: point
      # about.toml to the right file. Only a crate without any license file may show it,
      # with its authors written above the text by about.hbs.
      - name: Check that every license file read has its copyright line
        run: |
          cargo about generate --locked --format json \
            | jq -e '[.licenses[] | select(.source_path != null and (.text | test("<copyright holders>|<year>")))] | length == 0'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: notices
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # glibc rather than musl: the executable loads the graphics
          # libraries of the system (OpenGL, X11), which a static musl
          # executable can't. It runs on distributions with the glibc of
          # the runner or a newer one, hence the oldest Ubuntu runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
      # The version of rust-toolchain.toml, the one the checks of main ran with.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Read the executable name and the version of Cargo.toml
        run: |
          # The package of the application, the default member of the workspace (the
          # other members are tools, such as the generator of the game data).
          metadata=$(cargo metadata --no-deps --format-version 1)
          package=$(echo "$metadata" | jq -c '.workspace_default_members[0] as $id | .packages[] | select(.id == $id)')
          # The first binary target: the package name, unless [[bin]] or
          # src/bin/ gives another one.
          name=$(echo "$package" | jq -r '[.targets[] | select(.kind | index("bin")) | .name][0] // empty')
          if [ -z "$name" ]; then
            echo "Cargo.toml has no binary target to release"
            exit 1
          fi
          echo "NAME=$name" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$(echo "$package" | jq -r '.version')" >> "$GITHUB_ENV"
      - name: Check that the tag matches the version of Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $PACKAGE_VERSION of Cargo.toml"
            exit 1
          fi
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          directory="$NAME-$VERSION-${{ matrix.target }}"
          mkdir "$directory"
          cp README.md LICENSE THIRD-PARTY-LICENSES "$directory/"
          # The notices of what the executable embeds, at the paths the README links to.
          for file in assets/NOTICE.md assets/game-data/NOTICE.md assets/fonts/ofl-*.txt assets/icons/isc-lucide.txt; do
            mkdir -p "$directory/$(dirname "$file")"
            cp "$file" "$directory/$file"
          done
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/$NAME.exe" "$directory/"
            7z a "$directory.zip" "$directory"
            echo "ARCHIVE=$directory.zip" >> "$GITHUB_ENV"
          else
            cp "target/${{ matrix.target }}/release/$NAME" "$directory/"
            tar -czf "$directory.tar.gz" "$directory"
            echo "ARCHIVE=$directory.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    # Only the push of a tag: a run by hand on a tag builds without publishing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true
      - name: Create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
