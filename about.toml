# The THIRD-PARTY-LICENSES file of a release: `cargo about generate --locked --fail about.hbs`,
# run by the Release workflow. Keep `accepted` the same as `allow` in deny.toml.
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
ignore-dev-dependencies = true
private = { ignore = true }

# Crates whose license file isn't the one cargo-about would pick. A new version that changes
# the file fails the generation, its checksum then to update after reading it.
[wayland-protocols-plasma.clarify]
license = "MIT"

[[wayland-protocols-plasma.clarify.files]]
path = "LICENSE.txt"
license = "MIT"
checksum = "1cb6f4dee8c649f175736380495f0af0c753c87f22d50931692968bb24bf2161"

[dpi.clarify]
license = "Apache-2.0 AND MIT"

[[dpi.clarify.files]]
path = "LICENSE"
license = "Apache-2.0"
checksum = "6dc0e068dcf3a5bc8e054205b85b7720e1d49265bbc64bf515d2cf79197df69a"

[[dpi.clarify.files]]
path = "LICENSE-LIBM-MIT"
license = "MIT"
