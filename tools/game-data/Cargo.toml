[package]
name = "game-data"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generates the game data embedded in rust-exile-market."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }

[lints]
workspace = true
