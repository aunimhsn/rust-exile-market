<title>Narrow Styles</title>
<!--
  Style proposals for the narrow layout (roadmap step 0): every window of the
  wireframe docs/wireframes/window-layouts.excalidraw, in one of three styles.
  Switch between the styles and the variants with the tabs at the top, or open
  them directly, e.g. ?theme=slate&button=band&header=large.
  All prices and offers are sample data. Serve the repository root so that the
  orb icons of assets/currencies/ load:
    python3 -m http.server 8765 --bind 127.0.0.1
  then open http://127.0.0.1:8765/docs/mockups/narrow-styles.html?theme=forge
  The fonts come from Google Fonts here; the application will embed them (all
  under the SIL Open Font License).
-->

<style>
  /* Each theme only sets tokens; the components below use them all. */
  :root {
    --page: #08090a;
    --page-text: #9aa0a6;

    /* Path of Exile 2 colors, the same in every theme. */
    --rarity-normal: #d0d0d0;
    --rarity-magic: #8888ff;
    --rarity-rare: #ffff77;
    --rarity-unique: #c26a2c;
    --tier-1: #ff8c1a;
    --rarity-currency: #b4a787;
    --mod: #8f8fff;
    --corrupted: #e0423a;
    --rise: #5fcf80;
    --fall: #e66a5c;
  }
  [data-theme="forge"] {
    --bg-a: #121214;          /* header, price, status bar */
    --bg-b: #19191c;          /* item, offers, settings */
    --row-alt: #1f1f23;
    --banner: #2b2414;
    --text: #e6e2d8;
    --weak: #8e8a80;
    --faint: #5d5a54;
    --accent: #c9a25e;
    --control: #26262b;
    --control-line: #34343a;
    --warn: #e2b04a;
    --font-display: "Cinzel", Georgia, serif;
    --font-body: "Source Sans 3", "Segoe UI", sans-serif;
    --font-number: "Source Sans 3", "Segoe UI", sans-serif;
    --display-weight: 600;
    --display-case: none;
    --display-size: 21px;
    --body-size: 14px;
    --radius: 3px;
  }
  [data-theme="slate"] {
    --bg-a: #0f1216;
    --bg-b: #151a20;
    --row-alt: #1a2028;
    --banner: #8a6a10;        /* dark yellow: warnings stand apart from the league colors */
    --banner-text: #f8edc2;
    --text: #e3e8ef;
    --weak: #8692a3;
    --faint: #556070;
    --accent: #f2f5f9;        /* white: the colors are kept for the item rarities */
    --on-accent: #0f1216;
    --control: #1d242d;
    --control-line: #2a3440;
    --warn: #f0b85a;
    --font-display: "Manrope", "Segoe UI", sans-serif;
    --font-body: "Manrope", "Segoe UI", sans-serif;
    --font-number: "JetBrains Mono", ui-monospace, monospace;
    --display-weight: 800;
    --display-case: none;
    --display-size: 20px;
    --body-size: 13.5px;
    --radius: 3px;          /* small information elements; action blocks stay square */
  }
  [data-theme="compact"] {
    --bg-a: #101211;
    --bg-b: #171a18;
    --row-alt: #1c201d;
    --banner: #2e2511;
    --text: #e4e6e2;
    --weak: #8b918b;
    --faint: #5a605a;
    --accent: #f0a83c;
    --control: #222622;
    --control-line: #303630;
    --warn: #f0a83c;
    --font-display: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
    --font-body: "Barlow", "Segoe UI", sans-serif;
    --font-number: "Barlow", "Segoe UI", sans-serif;
    --display-weight: 700;
    --display-case: uppercase;
    --display-size: 22px;
    --body-size: 14px;
    --radius: 2px;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--page-text); font: 14px/1.4 system-ui, sans-serif; }
  .sheet { padding: 32px 40px 48px; display: grid; gap: 36px; width: max-content; }
  .styles {
    position: sticky; top: 0; z-index: 1; display: flex; gap: 6px; padding: 12px 40px;
    background: rgba(8, 9, 10, .92); border-bottom: 1px solid #1d1f22; backdrop-filter: blur(6px);
  }
  .styles button {
    padding: 7px 16px; border-radius: 6px; border: 1px solid #2a2d31; background: #121417; color: #aab0b6;
    font: 600 14px/1 system-ui, sans-serif; cursor: pointer;
  }
  .styles button:hover { color: #fff; border-color: #444a50; }
  .styles button[aria-pressed="true"] { background: #f2f5f9; border-color: #f2f5f9; color: #0f1216; }
  .styles .group { display: flex; gap: 6px; align-items: center; }
  .styles .group + .group { margin-left: 18px; padding-left: 18px; border-left: 1px solid #2a2d31; }
  .styles .group > span { color: #6c737a; font: 500 12px/1 system-ui, sans-serif; margin-right: 4px; }
  .file-warning { margin: 16px 40px 0; padding: 12px 16px; border-radius: 6px; background: #3a2a10; color: #f0c674; font: 14px/1.5 system-ui, sans-serif; max-width: 900px; }
  .file-warning code { color: #fff; }
  .sheet > header h1 { margin: 0; color: #e8e8e8; font: 600 28px/1.2 system-ui, sans-serif; }
  .sheet > header p { margin: 6px 0 0; max-width: 90ch; }
  .section h2 { margin: 0 0 14px; color: #c8c8c8; font: 600 16px/1.2 system-ui, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
  .row { display: flex; gap: 40px; align-items: flex-start; }
  .slot { display: grid; gap: 8px; width: 420px; }
  .slot > span { font-size: 13px; }

  /* Window. */
  .win {
    position: relative; width: 420px; overflow: hidden; border-radius: 8px; box-shadow: 0 12px 40px rgba(0, 0, 0, .55);
    background: var(--bg-b); color: var(--text);
    font: 400 var(--body-size)/1.4 var(--font-body);
    font-variant-numeric: tabular-nums;
  }
  .band { padding: 12px 14px; }
  .a { background: var(--bg-a); }
  .b { background: var(--bg-b); }

  /* Title bar: one line in place of the system title bar and of the header. The emblem, the league (its color
     says softcore or hardcore), then the icons: Settings, Minimize, Close, without borders. The empty space
     moves the window. */
  .app-titlebar { display: flex; align-items: stretch; height: 28px; padding-left: 12px; background: var(--bg-a); }
  .app-emblem { display: block; width: 16px; height: 16px; align-self: center; margin-right: 10px; }
  /* The league block, tinted with the color of its trade (the only sign of softcore or hardcore, also in its
     tooltip), a line of that color on the left, the chevron in white; lighter under the pointer. */
  .app-league {
    display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px; color: var(--text); font-size: 13px; cursor: pointer;
    background: var(--league-bg); box-shadow: inset 2px 0 0 var(--league-line);
  }
  .app-league:hover { background: var(--league-bg-hover); }
  .app-league .ico { color: var(--text); }
  /* A new league has started while the player is on Standard: a bubble under the league block, until the player
     switches or closes it. */
  .app-notice { display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text); }
  .app-notice b { font-weight: 700; }
  .app-notice .app-notice-text { flex: 1; }
  .app-notice .pill { background: var(--accent); color: var(--on-accent, var(--bg-a)); cursor: pointer; }
  .app-notice .app-notice-close { display: grid; place-items: center; color: var(--weak); cursor: pointer; }
  .app-notice .app-notice-close:hover { color: var(--text); }
  .app-notice {
    position: absolute; z-index: 2; top: 36px; left: 30px; width: 330px; padding: 10px 10px 10px 14px;
    background: #20272f; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  }
  .app-notice::before {
    content: ""; position: absolute; top: -5px; left: 36px; width: 10px; height: 10px; background: #20272f; transform: rotate(45deg);
  }
  .app-icon-button { width: 36px; display: grid; place-items: center; color: var(--weak); cursor: pointer; }
  .app-icon-button:hover, .app-icon-button.is-on { color: var(--accent); }
  :root, [data-league="softcore"] { --league-bg: #13263a; --league-line: #6aa7de; --league-kind: "Softcore"; --league-bg-hover: #1a3350; }
  [data-league="hardcore"] { --league-bg: #351417; --league-line: #e0706a; --league-kind: "Hardcore"; --league-bg-hover: #4a1b20; }
  .spacer { flex: 1; }
  .button, .input {
    background: var(--control); border: 1px solid var(--control-line); border-radius: var(--radius); color: var(--text);
    font: inherit;
  }


  .label { font: 600 11px/1 var(--font-body); letter-spacing: .1em; text-transform: uppercase; color: var(--weak); }
  .head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .head .right { margin-left: auto; color: var(--weak); font-size: 12px; }
  .head .age { color: var(--faint); font-size: 12px; }
  /* The search age goes under the OFFERS title. */
  .title-stack { display: grid; gap: 4px; }
  .title-stack .age { font-size: 11.5px; line-height: 1; }

  .name-row { display: flex; align-items: flex-start; gap: 12px; }
  .name {
    flex: 1; min-width: 0; font: var(--display-weight) var(--display-size)/1.15 var(--font-display);
    text-transform: var(--display-case); letter-spacing: .01em;
  }
  /* Trade site link: a small pill, rounded like the tags; the verb says it can be clicked. */
  .trade {
    flex: none; margin-top: 1px; padding: 4px 10px; border-radius: var(--radius);
    background: var(--control); color: var(--text); font-size: 12px; font-weight: 600; line-height: 1.2;
    white-space: nowrap; text-decoration: none; cursor: pointer;
  }
  .trade:hover { background: var(--control-line); color: var(--accent); }
  .link:hover { text-decoration: underline; }
  .item-band { position: relative; }
  .base { margin-top: 2px; }
  .meta { display: flex; flex-wrap: wrap; gap: 5px 6px; align-items: center; margin-top: 6px; color: var(--weak); font-size: 13px; }
  .tag { padding: 1px 7px; border-radius: var(--radius); background: var(--control); color: var(--text); font-size: 12px; }
  .tag.corrupted { color: #fff; background: #351417; }   /* the background of the hardcore league */
  .summary { margin-top: 8px; font-size: 13px; }
  /* Stats toggle: a pill like "Check on trade", and the number of filters next to it. */
  .stats-toggle { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .pill {
    padding: 4px 10px; border-radius: var(--radius); background: var(--control); color: var(--text);
    font-size: 12px; font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer;
  }
  .pill:hover { background: var(--control-line); color: var(--accent); }
  .stats-toggle .filters { color: var(--accent); font-weight: 600; }
  .ico { display: block; }

  .rarity-unique { color: var(--rarity-unique); }
  .rarity-rare { color: var(--rarity-rare); }
  .rarity-magic { color: var(--rarity-magic); }
  .rarity-normal { color: var(--rarity-normal); }
  .rarity-currency { color: var(--rarity-currency); }

  .stats { margin-top: 8px; display: grid; gap: 6px; }
  .req { color: var(--weak); font-size: 12px; display: flex; justify-content: space-between; }
  .reqline { margin-top: 6px; color: var(--weak); font-size: 12px; }
  .stats-group { display: flex; justify-content: space-between; margin-top: 6px; color: var(--faint); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .stats-group:first-child { margin-top: 0; }
  .stats-group em { font-style: normal; letter-spacing: 0; text-transform: none; font-weight: 600; color: var(--weak); }
  .stats-group em.open { color: var(--accent); }
  /* Tier of a rare modifier, before the range of that tier. */
  .tier { display: inline-block; font-weight: 700; margin-right: 6px; line-height: 1.4; }
  .prop { font-size: 13px; color: var(--text); }
  .prop span { color: var(--weak); }
  .sep { height: 1px; background: var(--control-line); margin: 2px 0; }
  .mod { display: grid; grid-template-columns: 20px 1fr auto; gap: 2px 8px; align-items: center; color: var(--mod); font-size: 13.5px; }
  .mod.fixed { grid-template-columns: 20px 1fr; }
  .check { width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--weak); background: var(--control); display: grid; place-items: center; color: var(--bg-a); }
  .check.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent, var(--bg-a)); }
  .input { width: 46px; padding: 1px 6px; text-align: right; font-family: var(--font-number); font-size: 12.5px; }
  .roll { grid-column: 2; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 11px; }
  .bar { width: 96px; height: 4px; border-radius: 2px; background: var(--control-line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .note { color: var(--faint); font-size: 12px; }

  .prices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .price { display: flex; align-items: center; gap: 7px; font: 600 19px/1 var(--font-number); }
  .price img { width: 24px; height: 24px; }
  .line { margin-top: 9px; font-size: 13px; }
  .rise { color: var(--rise); }
  .fall { color: var(--fall); }
  .warn { color: var(--warn); }
  .msg { font-size: 14px; }
  .msg + .msg { margin-top: 2px; }
  .muted { color: var(--weak); }
  .candidates { margin: 6px -14px 0; }
  .candidates div { display: flex; justify-content: space-between; align-items: center; padding: 4px 14px; }
  .candidates div:nth-child(odd) { background: rgba(255, 255, 255, .03); }
  .candidates span:last-child { display: flex; align-items: center; gap: 6px; font-family: var(--font-number); }
  .candidates img { width: 18px; height: 18px; }

  .offers { margin: 0 -14px; }
  .offers .cols, .offers .row-o { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 5px 14px; align-items: center; }
  .offers.three .cols, .offers.three .row-o { grid-template-columns: 1fr 60px 90px; }
  .offers .cols { color: var(--faint); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; padding-bottom: 4px; }
  .offers .cols span:not(:first-child), .offers .row-o span:not(:first-child) { text-align: right; }
  .offers .row-o:nth-child(even) { background: var(--row-alt); }
  .offers .row-o .p { display: flex; align-items: center; gap: 6px; font-family: var(--font-number); font-weight: 600; }
  .offers .row-o img { width: 18px; height: 18px; }
  .offers .row-o.sus .p { color: var(--faint); text-decoration: line-through; }
  .offers .row-o.sus .p::after { content: "?"; color: var(--warn); text-decoration: none; display: inline-block; margin-left: 2px; }
  /* Offer hovered: the row lights up and the tooltip of its item opens next to it. */
  .offers .row-o { position: relative; }
  .offers .row-o.hovered, .offers .row-o:hover { background: var(--control-line) !important; cursor: pointer; }
  .offer-tooltip {
    position: absolute; z-index: 2; right: 10px; bottom: calc(100% + 6px); width: 300px; padding: 12px 14px;
    background: #20272f; border-radius: 4px; box-shadow: 0 10px 30px rgba(0, 0, 0, .6); text-align: left; font-size: 12.5px;
  }
  /* No room above the row (the first offers): the tooltip opens below it. */
  .offer-tooltip.below { bottom: auto; top: calc(100% + 6px); }
  .tt-warn { margin-top: 8px; color: var(--warn); font-size: 12px; }
  .tt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .tt-name { font-weight: 700; font-size: 14px; }
  .tt-price { font-family: var(--font-number); font-weight: 600; }
  .tt-meta { color: var(--weak); font-size: 12px; margin-top: 2px; }
  .tt-mods { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--control-line); display: grid; gap: 3px; }
  .tt-mod { display: flex; justify-content: space-between; gap: 10px; color: var(--mod); }
  .tt-mod.prop { color: var(--text); }   /* item properties are white, as in the game */
  .tt-tier { display: inline-block; min-width: 26px; }
  /* Top tiers (1 to 3) in white, the others faint. */
  .tier { color: var(--faint); }
  .tier.tier-top { color: var(--accent); }
  /* Tier 1 in a vivid orange, so that it stands out on the dark bands; tiers 2 and 3 stay white. */
  .tier.t1 { color: var(--tier-1); }
  .delta { font-family: var(--font-number); font-weight: 600; font-size: 12px; }
  .delta.up { color: var(--rise); }
  .delta.down { color: var(--fall); }
  .tt-foot { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; }
  .tt-price { display: flex; align-items: center; gap: 6px; }
  .tt-price img { width: 18px; height: 18px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--weak); font-size: 12px; }
  .status i { width: 7px; height: 7px; border-radius: 50%; }
  .status.s-online i { background: var(--rise); }
  .status.s-away i { background: var(--warn); }
  .status.s-offline i { background: var(--fall); }
  .pill.done { display: inline-flex; align-items: center; gap: 5px; background: var(--accent); color: var(--on-accent, var(--bg-a)); }
  .tt-hint { margin-top: 6px; color: var(--weak); font-size: 11.5px; text-align: right; }
  /* Pinned by a click on the row: it stays open; it looks the same, the pill says what happened. */
  .online.away { background: var(--warn) !important; }
  .online { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--rise); margin-right: 6px; vertical-align: middle; }
  .actions { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .link { color: var(--accent); font-weight: 600; }
  .button { padding: 6px 12px; display: inline-flex; gap: 8px; align-items: center; }
  .button.primary { padding: 8px 16px; }
  .search-band { display: flex; align-items: stretch; }
  .search-block {
    flex: none; width: 56px; display: grid; place-items: center;
    background: var(--accent); color: var(--on-accent, var(--bg-a));
  }
  .search-text { flex: 1; display: grid; align-content: center; gap: 4px; padding: 12px 14px; font-size: 13px; }
  /* Search again: a flat block in the bottom right corner of the offers band; the countdown, then the refresh icon. */
  /* The title row of the offers band holds the action block in its top right corner. */
  .flat-head { margin: -12px -14px 6px 0; height: 48px; align-items: center; }
  .flat-head .right { margin-left: auto; padding-right: 12px; }
  .flat-head .again { align-self: stretch; height: auto; }
  /* Show more offers: only a chevron under the list; the whole width stays clickable. */
  .more {
    margin: 6px -14px -12px; height: 32px; display: flex; align-items: center; justify-content: center; gap: 8px;
    color: var(--weak); cursor: pointer;
  }
  .more:hover { color: var(--accent); }
  /* The double chevron is raised 3 px to look centered (chosen by eye); on hover it slides down 2 px. */
  .more .ico { transition: transform .2s ease-out; transform: translateY(-3px); }
  .more:hover .ico { transform: translateY(-1px); }
  @media (prefers-reduced-motion: reduce) { .more .ico { transition: none; } }
  .again { flex: none; width: 56px; height: 48px; display: grid; place-items: center; font: 600 13px/1 var(--font-body); }
  .again.waiting { background: var(--control); color: var(--weak); }
  .again.ready { background: var(--accent); color: var(--on-accent, var(--bg-a)); }
  /* Hover on the white action blocks: the search icon grows, the refresh icon grows and turns. */
  .search-block, .again.ready { cursor: pointer; }
  .search-block .ico, .again.ready .ico { transition: transform .22s cubic-bezier(.2, .8, .3, 1.2); }
  .search-block:hover .ico { transform: scale(1.15); }
  .again.ready:hover .ico { transform: scale(1.12) rotate(90deg); }
  @media (prefers-reduced-motion: reduce) {
    .search-block .ico, .again.ready .ico { transition: none; }
  }
  .button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent, var(--bg-a)); font-weight: 700; }
  .button.wait { color: var(--faint); }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--control-line); border-top-color: var(--accent); }

  .banner { display: flex; align-items: stretch; background: var(--banner); color: var(--banner-text, var(--warn)); font-size: 12px; font-weight: 600; }
  .banner > span:first-child { flex: 1; padding: 10px 14px; align-self: center; }
  .foot { padding: 6px 14px; color: var(--faint); font-size: 11.5px; }
  /* Before the first item: the emblem as a faint watermark behind the text (2.25 % opacity), so that it takes no
     height. */
  .empty { position: relative; padding: 64px 14px; text-align: center; color: var(--weak); overflow: hidden; }
  .empty::before {
    content: ""; position: absolute; inset: 0; background: url("../../assets/logo/emblem.svg") center / 190px no-repeat;
    opacity: .0225; pointer-events: none;
  }
  .empty > * { position: relative; }

  .keys { margin: 12px 0; display: flex; justify-content: center; gap: 6px; align-items: center; }
  .key { padding: 3px 9px; border: 1px solid var(--control-line); border-bottom-width: 2px; border-radius: 4px; color: var(--text); background: var(--control); font-family: var(--font-number); }

  .settings h3 { margin: 0; font: var(--display-weight) 18px/1.2 var(--font-display); text-transform: var(--display-case); }
  .field { margin-top: 16px; display: grid; gap: 6px; }
  .radio { display: flex; gap: 8px; align-items: center; }
  .radio i { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--faint); }
  .radio.on i { border-color: var(--accent); background: radial-gradient(var(--accent) 35%, transparent 45%); }
  .toggle { display: flex; gap: 8px; align-items: center; }
  .disclaimer { margin-top: 22px; color: var(--faint); font-size: 11.5px; }
  /* The version and the author, in the status bar while the settings are open; the site is a link, underlined
     under the pointer. */
  .app-author a { color: var(--weak); text-decoration: none; }
  .app-author a:hover { color: var(--text); text-decoration: underline; }

</style>
</head>
<body>
<nav class="styles" id="styles" aria-label="Variants"></nav>
<div class="file-warning" id="file-warning" hidden>
  This page is open as a file: the browser can't reach <code>assets/</code>, so the orbs and the logo are missing.
  Serve the repository root (<code>python3 -m http.server 8765 --bind 127.0.0.1</code>) and open
  <code>http://127.0.0.1:8765/docs/mockups/narrow-styles.html</code>.
</div>
<div class="sheet" id="sheet"></div>

<script>
  const THEMES = {
    forge: { title: "A · Forge", text: "Close to the game: engraved capitals for the item names (Cinzel), a sober text face (Source Sans 3), gold accent, warm near-black grays." },
    slate: { title: "B · Slate", text: "Modern and sharp: one geometric face (Manrope), numbers in a monospace face (JetBrains Mono), white as the main color so that the colors stay for the item rarities, cool near-black grays." },
    compact: { title: "C · Compact", text: "Dense, made for the narrow width: condensed capitals for the names (Barlow Semi Condensed), Barlow for the text, amber accent, neutral near-black grays." },
  };
  const VARIANTS = {
    theme: { label: "Style", options: Object.fromEntries(Object.entries(THEMES).map(([k, v]) => [k, v.title])), fallback: "slate" },
    league: { label: "League", options: { softcore: "Softcore", hardcore: "Hardcore" }, fallback: "softcore" },
  };
  const params = new URLSearchParams(location.search);
  const chosen = Object.fromEntries(Object.entries(VARIANTS).map(([key, v]) => [key, params.get(key) in v.options ? params.get(key) : v.fallback]));
  let theme = chosen.theme;

  const ORB = { div: "divine-orb", chaos: "chaos-orb", ex: "exalted-orb" };
  const orb = key => `<img src="../../assets/currencies/${ORB[key]}.png" alt="">`;

  // Icons, drawn with the current text color.
  const svg = (size, body) => `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const ICON = {
    search: size => svg(size, '<circle cx="7" cy="7" r="4.6"/><path d="M10.4 10.4 14 14"/>'),
    refresh: size => svg(size, '<path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.6 2.6v3.3h-3.3"/>'),
    chevron: size => svg(size, '<path d="M6 4l4 4-4 4"/>'),
    down: size => svg(size, '<path d="M4 6l4 4 4-4"/>'),
    downDouble: size => svg(size, '<path d="M4 3.5l4 4 4-4"/><path d="M4 8.5l4 4 4-4"/>'),
    check: size => `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.2 8.4l3.1 3.1 6.5-7"/></svg>`,
    // The "settings" icon of Lucide (ISC license), on its 24 px grid.
    gear: size => `<svg class="ico" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>`,
  };

  // Blocks.
  const topBar = (settings = false, league = "Forbidden Rites") => {
    const kind = document.documentElement.dataset.league === "hardcore" ? "Hardcore" : "Softcore";
    return `
    <div class="app-titlebar">
      <img class="app-emblem" src="../../assets/logo/emblem.svg" alt="">
      <div class="app-league" title="${kind} · Change the league"><span class="app-league-name">${league}</span>${ICON.down(12)}</div>
      <div class="spacer"></div>
      <div class="app-icon-button ${settings ? "is-on" : ""}" title="Settings">${ICON.gear(15)}</div>
      <div class="app-icon-button" title="Minimize">${svg(13, '<path d="M3 8h10"/>')}</div>
      <div class="app-icon-button" title="Close">${svg(13, '<path d="M4 4l8 8M12 4l-8 8"/>')}</div>
    </div>`;
  };
  const foot = (value = "poe2scout 12min ago · GGG trade 2min ago") => `<div class="foot a">${value}</div>`;
  const banner = value => `<div class="banner"><span>${value}</span></div>`;
  const newLeague = league => `
    <div class="app-notice"><span class="app-notice-text"><b>${league}</b> has started.</span>
      <span class="pill">Switch</span><span class="app-notice-close" title="Close">${svg(12, '<path d="M4 4l8 8M12 4l-8 8"/>')}</span></div>`;

  function item(it, unfolded = false) {
    const tags = (it.tags || []).map(t => `<span class="tag ${/^Corrupt|^Corrompu/.test(t) ? "corrupted" : ""}">${t}</span>`).join("");
    const filters = it.filters ? `<span class="filters">${it.filters}</span>` : "";
    // "Show 6 stats" when folded, "Hide stats" when unfolded; French when the label is French.
    const count = Number((it.statsLabel || "").match(/\d+/)?.[0] || 0);
    const fr = /Statistiques/.test(it.statsLabel || "");
    const plural = count > 1 ? "s" : "";
    // An item without modifiers (a normal item) only has filters to show.
    const pill = unfolded => count === 0
      ? (unfolded ? (fr ? "Masquer les filtres" : "Hide filters") : (fr ? "Afficher les filtres" : "Show filters"))
      : unfolded
        ? (fr ? "Masquer les stats" : "Hide stats")
        : (fr ? `Afficher ${count} stat${plural}` : `Show ${count} stat${plural}`);
    let stats = "";
    if (it.stats && unfolded) {
      stats = `<div class="stats-toggle open"><span class="pill">${pill(true)}</span>${filters}</div><div class="stats">${it.stats.map(row => {
        if (row === "sep") return `<div class="sep"></div>`;
        if (row.minHeader) return `<div class="req"><span></span><span>min</span></div>`;
        if (row.group) return `<div class="stats-group"><span>${row.group}${row.fill ? ` <em>${row.fill}</em>` : ""}</span>${row.min ? "<span>min</span>" : ""}</div>`;
        if (row.prop) return `<div class="prop"><span>${row.prop[0]}:</span> ${row.prop[1]}</div>`;
        if (row.note) return `<div class="note">${row.note}</div>`;
        const check = row.check === undefined ? "<span></span>" : `<span class="check ${row.check ? "on" : ""}">${row.check ? ICON.check(11) : ""}</span>`;
        const input = row.min !== undefined ? `<span class="input">${row.min}</span>` : "";
        const range = `<span class="range">${row.tier ? `<span class="tier ${row.tier <= 3 ? "tier-top" : ""} t${row.tier}">T${row.tier}</span>` : ""}${row.range}</span>`;
        // The bar covers every tier of the modifier (the fixed range of a unique); the text gives the tier and its range.
        const bar = `<span class="bar"><i style="width:${row.share * 100}%"></i></span>`;
        const roll = row.range ? `<div class="roll">${bar}${range}</div>` : "";
        return `<div class="mod ${input ? "" : "fixed"}">${check}<span>${row.mod}</span>${input}${roll}</div>`;
      }).join("")}</div>`;
    } else if (it.statsLabel) {
      stats = `<div class="stats-toggle"><span class="pill">${pill(false)}</span>${filters}</div>`;
    }
    return `
      <div class="band b item-band">
        <div class="name-row">
          <div class="name rarity-${it.rarity}">${it.name}</div>
          <a class="trade" title="${it.tradeTitle || "Open the search on the trade site"}">${it.tradeLabel || "Check on trade"}</a>
        </div>
        ${it.base ? `<div class="base">${it.base}</div>` : ""}
        <div class="meta"><span>${it.cls}</span>${tags}</div>
        ${it.summary ? `<div class="summary">${it.summary}</div>` : ""}

  function price(p, lang = "en") {
    const label = lang === "fr" ? "Prix" : "Price";
    let body = "";
    const row = values => `<div class="prices">${[["div", values[0]], ["chaos", values[1]], ["ex", values[2]]].map(([k, v]) => `<div class="price">${orb(k)}${v}</div>`).join("")}</div>`;
    const inline = values => `${values[0]} div · ${values[1]} c · ${values[2]} ex`;
    let caption = "";
    if (p.stackValues) {
      // Stack: the value of the copied stack in large, the unit price on a small line, to compare with the offers.
      body = `${row(p.stackValues)}<div class="line muted">Unit price: ${inline(p.values)}</div>`;
      // Currency exchange items always have plenty of offers: the stack size replaces their count.
      caption = `Stack of ${p.stackSize}`;
      if (p.trend) body += `<div class="line ${p.rising === false ? "fall" : "rise"}">${p.trend}</div>`;
    } else if (p.values) {
      body = row(p.values);
      if (p.trend) body += `<div class="line ${p.rising === false ? "fall" : "rise"}">${p.trend}</div>`;
      if (p.warning) body += `<div class="line warn">${p.warning}</div>`;
    }
    if (p.note) body += `<div class="line muted">${p.note}</div>`;
    if (p.lines) body = p.lines.map((l, i) => `<div class="msg ${i ? "muted" : ""}">${l}</div>`).join("");
    if (p.candidates) {
      body = `<div class="msg">Identify the item to get its price.</div><div class="line muted">Possible uniques</div>
        <div class="candidates">${p.candidates.map(([n, v, k]) => `<div><span class="rarity-unique">${n}</span><span>${v} ${orb(k)}</span></div>`).join("")}</div>`;
    }
    const right = caption || p.offers;
    const title = p.estimate ? (lang === "fr" ? "Prix estimé" : "Estimated price") : label;
    return `<div class="band a"><div class="head"><span class="label">${title}</span>${right ? `<span class="right">${right}</span>` : ""}</div>${body}</div>`;
  }

  function offerTooltip(t) {
    const compare = (list, kind = "") => list.map(m => {
      const diff = m.yours === undefined ? "" : m.value - m.yours;
      const delta = diff === "" || diff === 0 ? "" : `<span class="delta ${diff > 0 ? "up" : "down"}">${diff > 0 ? "+" : "−"}${Math.abs(diff)}</span>`;
      const tier = m.tier ? `<span class="tt-tier"><span class="tier ${m.tier <= 3 ? "tier-top" : ""} t${m.tier}">T${m.tier}</span></span>` : "";
      return `<div class="tt-mod ${kind}"><span>${tier}${m.text}</span>${delta}</div>`;
    }).join("");
    return `<div class="offer-tooltip ${t.pinned ? "pinned" : ""} ${t.below ? "below" : ""}">
      <div class="tt-head"><span class="rarity-${t.rarity || "unique"} tt-name">${t.name}</span><span class="tt-price">${t.price} ${orb(t.currency)}</span></div>
      <div class="tt-meta">${t.meta}</div>
      ${t.suspicious ? `<div class="tt-warn">Be careful: far below the market price.</div>` : ""}
      ${[[t.props, "prop"], [t.implicit, ""], [t.mods, ""]].filter(([list]) => list && list.length).map(([list, kind]) => `<div class="tt-mods">${compare(list, kind)}</div>`).join("")}

        <span class="status s-${t.status}"><i></i>${{ online: "Online", away: "Away", offline: "Offline" }[t.status]}</span>

  // One group of tabs per variant; the address keeps the choices, to share them.
  function render() {
    theme = chosen.theme;
    for (const key of Object.keys(VARIANTS)) document.documentElement.dataset[key] = chosen[key];
    const t = THEMES[theme];
    document.getElementById("styles").innerHTML = Object.entries(VARIANTS).map(([key, v]) =>
      `<div class="group"><span>${v.label}</span>${Object.entries(v.options).map(([value, label]) =>
        `<button type="button" data-variant="${key}" data-value="${value}" aria-pressed="${chosen[key] === value}">${label}</button>`).join("")}</div>`).join("");
    document.getElementById("sheet").innerHTML = `
      <header><h1>Style ${t.title}</h1><p>${t.text} Narrow layout, 420 px. Sample data.</p></header>
      ${SECTIONS.map(([title, slots]) => `<section class="section"><h2>${title}</h2><div class="row">${slots.map(([label, html]) => `<div class="slot"><span>${label}</span>${html}</div>`).join("")}</div></section>`).join("")}`;
  }

  document.getElementById("styles").addEventListener("click", event => {
    const { variant, value } = event.target.dataset;
    if (!variant) return;
    chosen[variant] = value;
    history.replaceState(null, "", "?" + new URLSearchParams(chosen));
    render();
  });
  document.getElementById("file-warning").hidden = location.protocol !== "file:";
  render();
</script>
