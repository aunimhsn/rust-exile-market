<title>Narrow Styles</title>
<!--
  Style proposals for the narrow layout (roadmap step 0): every window of the
  wireframe docs/wireframes/window-layouts.excalidraw, in one of three styles.
  Switch between the styles and the variants with the tabs at the top, or open
  them directly, e.g. ?theme=slate&league=hardcore.
  All prices and offers are sample data. Serve the repository root so that the
  orb icons of assets/currencies/ load:
    python3 -m http.server 8765 --bind 127.0.0.1
  then open http://127.0.0.1:8765/docs/mockups/narrow-styles.html?theme=forge
  The page is split into small files in narrow-styles/, so that a change reads
  only what it needs: css/ (one sheet per block), js/ (one script per block,
  the samples, the rendering) and sections/ (one per section of the sheet).
  The fonts come from Google Fonts here; the application will embed them (all
  under the SIL Open Font License).
-->
