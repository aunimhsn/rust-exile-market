[package]
name = "rust-exile-market"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Price checker for Path of Exile 2 items."
authors = ["Aunim HASSAN"]
license.workspace = true
repository = "https://github.com/aunimhsn/rust-exile-market"
readme = "README.md"
publish = false

[dependencies]
arboard = { version = "3.7", default-features = false }
directories = "6.0.0"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "glow", "links", "persistence", "x11"] }
egui = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false, features = ["svg", "image"] }
fluent-bundle = "0.16"
# Enables the PNG decoder of the image loader of egui_extras, which depends on the same
# version of image (Cargo merges the features of a crate), for the orbs of assets/currencies.
image = { version = "0.25.10", default-features = false, features = ["png"] }
log = "0.4"
serde.workspace = true
serde_json.workspace = true
simplelog = "0.12.2"
sys-locale = "0.3"
toml = "1.1.8"
unic-langid = "0.9.6"
ureq.workspace = true

# To choose the X11 backend of the window (see main.rs). A dependency of eframe also builds
# winit with Wayland: wayland-dlopen loads its library at run time, so that building doesn't
# need it.
[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11", "wayland-dlopen"] }
# The copy of the price-check hotkey (see src/hotkey.rs) sent to the game through XTest, with the
# version of x11rb that global-hotkey, arboard and winit use.
x11rb = { version = "0.13.2", features = ["xtest"] }

# The copy of the price-check hotkey sent to the game through SendInput by enigo, whose API is
# safe (`unsafe` is forbidden in the application).
[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6.1", default-features = false }

# The price-check hotkey heard by global-hotkey (XGrabKey under X11, RegisterHotKey on Windows).
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
global-hotkey = "0.9"

[dev-dependencies]
# The version used by fluent-bundle, whose resources the tests read as syntax trees: update
# them together.
fluent-syntax = "0.12.0"

[lints]
workspace = true

# The tools that make the data embedded in the application: the generator of the game data
# (see docs/game-data.md) and the icons of the currency exchange (see docs/images.md).
[workspace]
members = ["tools/exchange-icons", "tools/game-data"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Its default features, written out: the `cookies` feature must stay off, so that no session
# cookie of the trade site is ever sent back (see docs/trade-site-usage.md).
ureq = { version = "3.5.0", default-features = false, features = ["rustls", "gzip"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The dependencies (image decoding, fonts, rendering) stay fast in debug builds;
# only the code of the project is built without optimizations.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
codegen-units = 1
strip = true
